<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CasubTV</title>
<meta name="theme-color" content="#0B0D12">
<link rel="icon" href="logo.png">
<style>
:root{--bg:#0B0D12;--accent:#4AA3FF;--yellow:#FFD60A;--dim:#8D98A3;--txt:#CFD6DD;--glass:rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden;user-select:none}
#stage{position:fixed;inset:0;background:#000}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
video::-webkit-media-controls,video::-webkit-media-controls-enclosure,video::-webkit-media-controls-panel,video::-webkit-media-controls-overlay-play-button,video::-webkit-media-controls-start-playback-button{display:none!important;-webkit-appearance:none;opacity:0}
video::-internal-media-controls-overlay-cast-button{display:none}
video.cover{object-fit:cover}video.fill{object-fit:fill}
.hidden{display:none!important}

/* 스플래시 */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
/* 앱 아이콘 로고: 본체는 위→아래로 나타나고, 안테나 점은 마지막에 켜져 깜빡인다 (앱 Splash.kt와 동일, 분할선 135/432) */
.logo{position:relative;width:min(240px,60vw);aspect-ratio:1}
.logo img{position:absolute;inset:0;width:100%;height:100%}
.logo .body{clip-path:inset(31.25% 0 0 0)}
.logo .dot{clip-path:inset(0 0 68.75% 0)}
#splash .logo{transform:scale(.9);animation:lgScale 1.5s ease-out forwards}
#splash .logo .body{opacity:0;clip-path:inset(31.25% 0 100% 0);animation:lgBody 1.125s cubic-bezier(.4,0,.2,1) forwards}
#splash .logo .dot{opacity:0;animation:lgDotIn .375s linear 1.125s forwards,lgPulse .7s ease-in-out 1.5s infinite alternate}
#splash .sm{color:var(--dim);font-size:14px;margin-top:-6px;opacity:0;animation:lgDotIn .45s linear 1.05s forwards}
@keyframes lgScale{to{transform:scale(1)}}
@keyframes lgBody{to{opacity:1;clip-path:inset(31.25% 0 0 0)}}
@keyframes lgDotIn{to{opacity:1}}
@keyframes lgPulse{from{opacity:.35}to{opacity:1}}
#stopLogo .logo{width:min(240px,60vw)}

/* 메시지 / 정지 로고 */
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;text-align:center;text-shadow:0 2px 8px #000;z-index:5;pointer-events:none;padding:0 20px}
#stopLogo{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:4;font-size:64px;font-weight:800}
#stopLogo b{color:var(--accent)}

/* 하단 배너 */
#banner{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);width:min(900px,94vw);background:rgba(0,0,0,.6);border-radius:12px;padding:12px 18px 10px;z-index:10;opacity:0;pointer-events:none;transition:opacity .25s;display:flex;align-items:center;gap:0}
#banner.show{opacity:1}
#banner .ch{flex:1;min-width:0}
#banner .title{font-size:28px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banner .title.loading{color:var(--yellow)}
#banner .sub{font-size:20px;color:#ccc}
#banner .sep{width:1.5px;height:40px;background:rgba(255,255,255,.4);margin:0 16px}
#banner .epg{flex:1.3;min-width:0;font-size:14px;color:#B4BEC8}
#banner .epg div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banner .epg .now{font-size:16px;color:#fff}
#banner .clock{text-align:right}
#banner .clock small{display:block;font-size:14px;color:#B4BEC8}
#banner .clock span{font-size:26px}
#prog{position:absolute;left:18px;right:18px;bottom:4px;height:3px;border-radius:2px;background:rgba(255,255,255,.2)}
#prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}
@media(max-width:640px){#banner{flex-wrap:wrap}#banner .title{font-size:20px}#banner .sub{font-size:14px}#banner .epg,#banner .sep{display:none}#banner .clock span{font-size:18px}}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,24,30,.92);padding:10px 20px;border-radius:22px;font-size:16px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}

/* 채널 목록 */
#list{position:fixed;left:0;top:0;bottom:0;width:min(420px,88vw);background:rgba(0,0,0,.55);backdrop-filter:blur(14px);z-index:20;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .22s}
#list.open{transform:none}
#listTop{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#search{flex:1;background:rgba(255,255,255,.12);border:0;border-radius:20px;padding:9px 14px;color:#fff;font-size:15px;outline:none;min-width:0}
.pill{display:flex;background:rgba(255,255,255,.22);border-radius:26px;padding:2px}
.pill button,.iconbtn{background:none;border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer}
.pill button:hover,.iconbtn:hover{background:rgba(255,255,255,.18)}
#items{flex:1;overflow-y:auto;overscroll-behavior:contain}
.it{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 16px;cursor:pointer;border-left:5px solid transparent;color:var(--txt)}
.it:hover,.it.sel{background:rgba(255,255,255,.15)}
.it.cur{color:#fff;border-left-color:var(--accent);background:rgba(255,255,255,.1)}
.it img{width:34px;height:34px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.06);flex:none}
.it .t{flex:1;min-width:0}
.it .n{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .p{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .star{font-size:20px;color:#555;background:none;border:0;cursor:pointer;padding:4px}
.it .star.on{color:var(--yellow)}
#aspectBtn{position:fixed;right:18px;bottom:18px;z-index:12;background:rgba(255,255,255,.22);width:46px;height:46px;border-radius:50%;border:0;color:#fff;font-size:18px;cursor:pointer;opacity:0;transition:opacity .25s}
body.ui #aspectBtn{opacity:1}
#menuBtn{position:fixed;left:14px;top:14px;z-index:12;background:rgba(255,255,255,.22);width:46px;height:46px;border-radius:50%;border:0;color:#fff;font-size:20px;cursor:pointer;opacity:0;transition:opacity .25s}
body.ui #menuBtn{opacity:1}
body:not(.ui){cursor:none}

/* 환경설정 */
#settings{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:center;justify-content:center}
#sbox{width:min(760px,96vw);height:min(520px,92vh);background:#171b22;border-radius:18px;display:flex;overflow:hidden;box-shadow:0 20px 60px #000}
#tabs{width:150px;background:#11141a;padding:12px 0;flex:none}
#tabs div{padding:14px 18px;font-size:16px;color:var(--dim);cursor:pointer;border-left:4px solid transparent}
#tabs div.on{color:#fff;background:rgba(255,255,255,.08);border-left-color:var(--accent)}
#sbody{flex:1;overflow-y:auto;padding:10px 6px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.08)}
.row .l{flex:1;min-width:0}.row .l b{font-weight:400;font-size:18px;display:block}
.row .l small{color:var(--dim);font-size:13px}
.sw{width:46px;height:26px;border-radius:13px;background:#4A535C;position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}.sw.on::after{left:23px}
.tiles{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap}
.tiles button{background:#262C35;color:var(--txt);border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer}
.tiles button.on{background:#1E88E5;color:#fff}
.sub-h{padding:12px 16px 4px;font-size:20px;display:flex;align-items:center;gap:10px}
.sub-h button{background:#262C35;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
.close{margin:8px 16px;background:#262C35;color:#fff;border:0;border-radius:10px;padding:12px;width:calc(100% - 32px);font-size:16px;cursor:pointer}
@media(max-width:560px){#tabs{width:92px}#tabs div{padding:12px 10px;font-size:14px}}
</style>
</head>

<div id="stage"><video id="v" playsinline webkit-playsinline autoplay disablepictureinpicture disableremoteplayback controlslist="nodownload nofullscreen noremoteplayback" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video></div>
<div id="stopLogo" class="hidden"><div class="logo"><img src="logo.png" alt=""></div></div>
<div id="msg"></div>
<div id="banner"><div class="ch"><div class="title" id="bTitle"></div><div class="sub" id="bSub"></div></div>
  <div class="sep" id="bSep1"></div><div class="epg" id="bEpg"></div>
  <div class="sep" id="bSep2"></div><div class="clock" id="bClock"><small id="ampm"></small><span id="clk"></span></div>
  <div id="prog"><i></i></div></div>
<div id="toast"></div>
<button id="menuBtn" title="채널 목록">☰</button>
<button id="aspectBtn" title="화면 비율">⛶</button>

<div id="list">
  <div id="listTop">
    <input id="search" type="search" placeholder="채널 검색">
    <div class="pill">
      <button id="bSettings" title="환경설정">⚙</button>
      <button id="bStop" title="정지">■</button>
      <button id="bFull" title="전체화면">⤢</button>
    </div>
  </div>
  <div id="items"></div>
</div>

<div id="settings" class="hidden"><div id="sbox"><div id="tabs"></div><div id="sbody"></div></div></div>

<div id="splash"><div class="logo"><img class="body" src="logo.png" alt=""><img class="dot" src="logo.png" alt=""></div><div class="sm">채널 목록 불러오는 중…</div></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
"use strict";
/* ───────── 설정 (Channels.kt Config) ───────── */
const REPO = "kenpark76/kenpark76.github.io";
const CFG = {
  RAW: `https://raw.githubusercontent.com/${REPO}/main`,
  API: `https://api.github.com/repos/${REPO}/contents`,
  PAGES: "https://kenpark76.github.io",
};
CFG.EPG = CFG.PAGES + "/koreatvEPG.xml";
CFG.MIRRORS = [CFG.PAGES, "https://backup.760515.xyz"];

const SKIP_DELAYS = [3, 5, 10], SKIP_MAX_CHAIN = 5, LIST_IDLE_MS = 10000;
const CHANNEL_SYNC_MS = 6*3600e3, EPG_SYNC_MS = 3*3600e3, TOKEN_REFRESH_MS = 15*60e3, TOKEN_SOON_MS = 30*60e3;
const ASPECTS = ["맞춤","채우기","늘이기"], ASPECT_CLS = ["","cover","fill"];
const BAD_TTL = 30*60e3;
const MAX_CHANNELS = 60; // 61번째 채널부터는 목록에서 제외

/* ───────── 저장소 ───────── */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("ctv_"+k); return v==null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("ctv_"+k, JSON.stringify(v)); }catch{} },
};
const S = {
  epgOn: store.get("epg_on", true), clockOn: store.get("clock_on", true),
  aspect: store.get("aspect", 0), aspectOn: store.get("aspect_on", true),
  swipeVol: store.get("swipe_vol", true), stopBtn: store.get("stop_btn", true),
  skipOn: store.get("skip_on", true), skipIdx: store.get("skip_delay", 1),
  favs: new Set(store.get("favs", [])), favOnly: store.get("fav_only", false),
  startup: store.get("startup", null), last: store.get("last", null),
  sleepH: 0,
};

/* ───────── 채널 모델 (Channels.kt) ───────── */
const HAN = /\p{Script=Han}/u;
const CN_WORDS = /cctv|cgtn|china|phoenix|tvb|hunan|dragon\s?tv|hong\s?kong|taiwan|중화|중국|홍콩|대만/i;
const isChinese = (group, name, title) =>
  (group||"").startsWith("中国") || HAN.test(`${name} ${title}`) || HAN.test(group||"") || CN_WORDS.test(`${name} ${title}`) || CN_WORDS.test(group||"");

/** CloudFront 서명 주소의 만료 시각(ms). 서명 없으면 null. */
function urlExpiry(url){
  const q = url.split("?")[1]; if(!q) return null;
  const p = Object.fromEntries(q.split("&").map(s=>{const i=s.indexOf("=");return i<0?[s,""]:[s.slice(0,i),s.slice(i+1)]}));
  if(p.Expires && !isNaN(+p.Expires)) return +p.Expires*1000;
  if(!p.Policy) return null;
  try{
    const b = p.Policy.replace(/-/g,"+").replace(/_/g,"=").replace(/~/g,"/");
    const j = JSON.parse(atob(b));
    return j.Statement[0].Condition.DateLessThan["AWS:EpochTime"]*1000;
  }catch{ return null; }
}
const validUntil = c => c.uris.reduce((m,u)=>Math.max(m, urlExpiry(u) ?? Infinity), -Infinity);
const liveUris = (c, now=Date.now()) => c.uris.filter(u => (urlExpiry(u) ?? Infinity) > now + 30000);
const isExpired = (c, now=Date.now()) => c.uris.length === 0 || validUntil(c) <= now + 30000;

function mergeSameName(list){
  const m = new Map();
  for(const c of list){
    const f = m.get(c.name);
    m.set(c.name, f ? {...f, uris:[...new Set([...f.uris, ...c.uris])]} : c);
  }
  return [...m.values()];
}

async function fetchText(url, ms=10000){
  const ac = new AbortController(), t = setTimeout(()=>ac.abort(), ms);
  try{
    const r = await fetch(url, {signal: ac.signal, cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    return await r.text();
  } finally { clearTimeout(t); }
}

function parseChannels(text){
  const arr = JSON.parse(text.replace(/^﻿/, ""));
  const out = [];
  for(const o of arr){
    if(!o || isChinese(o.group, o.name, o.title)) continue;
    const uris = (o.uris||[]).filter(u => typeof u==="string" && u.startsWith("http"));
    if(!uris.length) continue;
    out.push({group:o.group||"", name:o.name||"", title:o.title || o.name, logo:o.logo||"", uris, headers:o.headers||{}});
  }
  return mergeSameName(out);
}

async function loadMirrors(){
  let l = [];
  try{
    const j = JSON.parse(await fetchText(CFG.RAW + "/config.json", 8000));
    l = (j.playlistUrl||[]).map(s=>String(s).replace(/\/+$/,""));
    if(l.length) store.set("mirrors", l);
  }catch{ l = store.get("mirrors", []); }
  return [...new Set([...l, ...CFG.MIRRORS])].filter(u => { try{ return !new URL(u).host.startsWith("test."); }catch{ return false; } });
}

async function loadPlaylistNames(){
  const c = store.get("names", null);
  if(c && Date.now() - c.t < 10*60e3) return new Set(c.v);
  try{
    const arr = JSON.parse(await fetchText(`${CFG.API}/playlist?ref=main`, 8000));
    const v = arr.map(a=>a.name).filter(n=>n && n.endsWith("-playlist.m3u8")).map(n=>n.slice(0,-"-playlist.m3u8".length));
    if(v.length){ store.set("names", {t:Date.now(), v}); return new Set(v); }
  }catch{}
  return c && c.v.length ? new Set(c.v) : null;
}

const masterUrls = (name, mirrors) => {
  const f = encodeURIComponent(name) + "-playlist.m3u8";
  return [...new Set([CFG.RAW + "/playlist/", ...mirrors.map(m=>m + "/playlist/")])].map(b=>b+f);
};

function applyPlaylists(list, names, mirrors){
  const merged = list.map(ch=>{
    const has = names ? names.has(ch.name) : ch.uris.some(u=>u.includes("_video_stream"));
    if(!has) return ch;
    const m = masterUrls(ch.name, mirrors);
    return {...ch, uris:[...m, ...ch.uris.filter(u=>!m.includes(u))]};
  });
  const known = new Set(list.map(c=>c.name));
  const extra = [...(names||[])].filter(n=>!known.has(n) && !isChinese("", n, n))
    .map(n=>({group:"기타", name:n, title:n, logo:"", uris:masterUrls(n, mirrors), headers:{}}));
  return [...merged, ...extra];
}

async function loadChannels(){
  const mirrors = await loadMirrors();
  let list = null;
  for(const base of [CFG.RAW, ...mirrors]){
    try{
      const text = await fetchText(base + "/koreatv.json");
      const p = parseChannels(text);
      if(p.length){ try{ localStorage.setItem("ctv_channels_raw", text); }catch{} list = p; break; }
    }catch{}
  }
  if(!list){
    try{ list = parseChannels(localStorage.getItem("ctv_channels_raw") || "[]"); }catch{ list = []; }
  }
  if(!list.length) return [];
  return applyPlaylists(list, await loadPlaylistNames(), mirrors);
}

/* ───────── 채널 점검 대체: 재생 실패 기록 (StreamProbe 대신 실제 재생 결과로 판단) ───────── */
let bad = (() => { const m = store.get("bad", {}); const now = Date.now(); for(const k in m) if(now - m[k] > BAD_TTL) delete m[k]; return m; })();
const markBad = n => { bad[n] = Date.now(); store.set("bad", bad); };
const clearBad = n => { if(bad[n]){ delete bad[n]; store.set("bad", bad); } };

/* ChannelFilter */
const Filter = {
  visible(list, now=Date.now()){
    const r = list.filter(c => !bad[c.name] && !isExpired(c, now));
    return (r.length ? r : list).slice(0, MAX_CHANNELS);
  },
  shown(visible){
    const r = S.favOnly && visible.some(c=>S.favs.has(c.name)) ? visible.filter(c=>S.favs.has(c.name)) : visible;
    return r.slice(0, MAX_CHANNELS);
  },
  keepPlaying(visible, source, name, holding){
    if(!name || visible.some(c=>c.name===name) || !holding) return visible;
    const pos = source.findIndex(c=>c.name===name); if(pos<0) return visible;
    const at = visible.filter(v => source.findIndex(c=>c.name===v.name) < pos).length;
    const r = visible.slice(); r.splice(at, 0, source[pos]); return r;
  },
};

/* ───────── EPG (XMLTV) ───────── */
let epg = {}, epgEnd = 0, lastEpgSync = 0, epgLoading = false;
const tvTime = s => { // "yyyyMMddHHmmss +0900"
  const m = /^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)\s*([+-])(\d\d)(\d\d)$/.exec((s||"").trim()); if(!m) return 0;
  const off = (m[7]==="-"?-1:1) * (+m[8]*60 + +m[9]);
  return Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]) - off*60e3;
};
function parseEpg(xml){
  const d = new DOMParser().parseFromString(xml, "text/xml");
  const names = {}, progs = {};
  d.querySelectorAll("channel").forEach(c=>{
    const id = c.getAttribute("id")||"";
    names[id] = [...c.querySelectorAll("display-name")].map(n=>n.textContent.trim());
  });
  d.querySelectorAll("programme").forEach(p=>{
    const id = p.getAttribute("channel")||"", start = tvTime(p.getAttribute("start")), stop = tvTime(p.getAttribute("stop"));
    const title = (p.querySelector("title")?.textContent||"").trim();
    if(start>0) (progs[id] ||= []).push({start, stop, title});
  });
  const out = {};
  for(const id in progs){ const l = progs[id].sort((a,b)=>a.start-b.start); for(const n of names[id]||[]) out[n] = l; }
  return out;
}
async function loadEpg(){
  if(epgLoading) return; epgLoading = true;
  try{
    const parsed = parseEpg(await fetchText(CFG.EPG, 20000));
    if(Object.keys(parsed).length){
      epg = parsed;
      epgEnd = Math.max(0, ...Object.values(parsed).map(l=>l.length ? l[l.length-1].stop : 0));
    }
  }catch{} finally { lastEpgSync = performance.now(); epgLoading = false; }
}
const isReadable = s => ![...s].some(ch => /\p{L}/u.test(ch) && !/[\p{Script=Hangul}\p{Script=Latin}\p{Script=Common}]/u.test(ch));
function nowNext(ch){
  const list = epg[ch.name] || epg[ch.title]; if(!list) return [null, null];
  const now = Date.now();
  const i = list.findIndex(p => now >= p.start && now < p.stop);
  const cur = i>=0 ? list[i] : null;
  const next = i>=0 ? list[i+1] : list.find(p=>p.start>now);
  if(cur && !isReadable(cur.title)) return [null, null];
  return [cur, next && isReadable(next.title) ? next : null];
}

/* ───────── 플레이어 (TvViewModel) ───────── */
const $ = id => document.getElementById(id);
const video = $("v");
let all = [], channels = [], index = 0, cursor = 0;
let hls = null, uriIdx = 0, refreshedOnce = false, recoverCount = 0, skipCount = 0;
let loading = false, failed = false, stopped = false, userPaused = false, epgShown = false;
let stallSince = 0, lastRetry = 0, lastChannelSync = performance.now(), reloading = false;
let skipTimer = null, stepTimer = null, lastStepAt = 0, lastStepDelta = 0;
let bannerTimer = null, epgTimer = null, toastTimer = null, listIdleTimer = null, uiTimer = null;
let lastFrames = -1, lastFramesAt = 0, listOpen = false;

const prefer = list => list.map(c=>{ const live = liveUris(c); return live.length && live.length !== c.uris.length ? {...c, uris:live} : c; });
const rebuild = () => {
  if(!all.length) return;
  const cur = channels[index]?.name;
  const holding = video.readyState >= 3 || (loading && !failed);
  const list = Filter.shown(Filter.keepPlaying(Filter.visible(all), all, cur, holding));
  if(!list.length) return;
  channels = list;
  const pos = list.findIndex(c=>c.name===cur);
  if(pos>=0){ index = cursor = pos; } else { index = Math.min(index, list.length-1); cursor = index; play(); }
  renderList();
};

function setMsg(t){ $("msg").textContent = t || ""; }
function toast(t){
  const e = $("toast"); e.textContent = t; e.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>e.classList.remove("show"), 4000);
}

function destroyHls(){ if(hls){ try{ hls.destroy(); }catch{} hls = null; } video.removeAttribute("src"); }

function play(resetRetry=true){
  const ch = channels[index]; if(!ch) return;
  stopped = false; userPaused = false; failed = false; stallSince = 0;
  $("stopLogo").classList.add("hidden");
  clearTimeout(skipTimer);
  if(resetRetry){ uriIdx = 0; refreshedOnce = false; recoverCount = 0; }
  uriIdx = Math.max(0, Math.min(uriIdx, ch.uris.length-1));
  store.set("last", ch.name); S.last = ch.name;
  setMsg(""); loading = true; epgShown = false;
  hideEpgInfo(); showBanner(); updateBanner();
  startStream(ch, ch.uris[uriIdx]);
  document.title = `${ch.title} - CasubTV`;
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({title: ch.title, artist: ch.group, album: "CasubTV"});
  }
  renderList(true);
}

function startStream(ch, url){
  destroyHls();
  const hasFallback = uriIdx < ch.uris.length - 1;
  if(window.Hls && Hls.isSupported()){
    hls = new Hls({
      lowLatencyMode: false, maxBufferLength: 15, maxMaxBufferLength: 40,
      manifestLoadingTimeOut: hasFallback ? 6000 : 10000, manifestLoadingMaxRetry: 1,
      levelLoadingTimeOut: hasFallback ? 6000 : 10000, fragLoadingTimeOut: 15000,
      xhrSetup(xhr){
        for(const [k,v] of Object.entries(ch.headers||{})){ try{ xhr.setRequestHeader(k, v); }catch{} }
      },
    });
    const mine = hls;
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
      // 오디오는 한국어/영어 우선(중국어 트랙 회피)
      const tracks = mine.audioTracks || [];
      const pick = tracks.findIndex(t=>/^ko/i.test(t.lang||"")) >= 0 ? tracks.findIndex(t=>/^ko/i.test(t.lang||""))
                 : tracks.findIndex(t=>/^en/i.test(t.lang||""));
      if(pick >= 0) mine.audioTrack = pick;
      playWithSound();
    });
    hls.on(Hls.Events.ERROR, (_, d)=>{
      if(mine !== hls) return;
      if(!d.fatal) return;
      if(d.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) return;
      if(d.type === Hls.ErrorTypes.MEDIA_ERROR && recoverCount < 2){ recoverCount++; mine.recoverMediaError(); return; }
      onStreamError();
    });
    hls.loadSource(url);
    hls.attachMedia(video);
  } else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src = url; playWithSound();
  } else {
    setMsg("이 브라우저는 HLS 재생을 지원하지 않습니다"); loading = false;
  }
}

function onStreamError(){
  const ch = channels[index]; if(!ch) return;
  if(uriIdx + 1 < ch.uris.length){ uriIdx++; play(false); return; }
  if(!refreshedOnce){ // 주소/토큰 만료 가능성: 목록을 다시 받아 재시도
    refreshedOnce = true;
    loadChannels().then(list=>{
      if(!list.length) return giveUp("재생 불가");
      all = prefer(list);
      if(channels[index]?.name !== ch.name) return; // 그 사이 사용자가 채널을 바꿈
      const vis = Filter.shown(Filter.visible(all));
      channels = vis; index = cursor = Math.max(0, vis.findIndex(c=>c.name===ch.name));
      uriIdx = 0; play(false);
    }).catch(()=>giveUp("재생 불가"));
  } else giveUp("재생 불가 · 연결을 다시 시도합니다");
}

function giveUp(msg){
  const ch = channels[index];
  setMsg(msg); failed = true; loading = false; lastRetry = performance.now();
  if(ch) markBad(ch.name);
  scheduleSkip();
}

function scheduleSkip(){
  if(!S.skipOn || skipTimer) return;
  const from = channels[index]; if(!from) return;
  if(channels.length < 2 || skipCount >= SKIP_MAX_CHAIN || !navigator.onLine) return;
  skipTimer = setTimeout(()=>{
    skipTimer = null;
    if(!failed || channels[index]?.name !== from.name) return;
    skipCount++;
    const next = (index + 1) % channels.length;
    index = cursor = next;
    toast(`${from.title} 재생 불가 · 다음 채널(${channels[index].title})로 이동했습니다`);
    play();
  }, SKIP_DELAYS[S.skipIdx] * 1000);
}

function recoverStall(){
  recoverCount++; setMsg("연결 재시도 중…");
  if(recoverCount === 1){ if(hls){ hls.stopLoad(); hls.startLoad(-1); } else video.load(); }
  else if(recoverCount === 2){ play(false); }
  else onStreamError();
}

/* 재생 이벤트 */
video.addEventListener("playing", ()=>{
  setMsg(""); loading = false; failed = false; recoverCount = 0; stallSince = 0; skipCount = 0;
  const ch = channels[index]; if(ch) clearBad(ch.name);
  updateBanner();
  if(!epgShown){ epgShown = true; showEpgInfo(); }
  if("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
});
video.addEventListener("pause", ()=>{ if("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused"; });
/* 소리: 사용자가 직접 음소거한 경우(userMuted)와 브라우저 자동재생 정책으로 임시 음소거된 경우(autoMuted)를 구분한다.
   임시 음소거는 사용자의 첫 클릭/키 입력/터치 때 바로 풀리고, 이후 채널을 바꿔도 소리가 유지된다. */
let userMuted = false, autoMuted = false, toldMute = false;
function playWithSound(){
  video.muted = userMuted;
  video.play().then(()=>{ if(autoMuted && !userMuted) tryUnmute(); }).catch(()=>{
    if(userMuted){ return; }
    video.muted = true; autoMuted = true;
    video.play().catch(()=>{});
    if(!toldMute){ toldMute = true; toast("브라우저가 소리를 막았습니다. 아무 키나 화면을 한 번 누르면 소리가 켜집니다"); }
  });
}
function tryUnmute(){
  if(!autoMuted || userMuted) return;
  video.muted = false; autoMuted = false;
  if(video.paused && !userPaused && !stopped) video.play().catch(()=>{ video.muted = true; autoMuted = true; });
}
["pointerdown","keydown","touchend","click"].forEach(ev=>document.addEventListener(ev, ()=>{ if(autoMuted) tryUnmute(); }, true));
video.addEventListener("loadeddata", ()=>{ if(autoMuted && navigator.userActivation?.hasBeenActive) tryUnmute(); });

/* 감시자(2초): 버퍼링 정체·화면 멈춤·주기적 동기화 */
setInterval(()=>{
  const now = performance.now();
  if(document.hidden || stopped || !channels.length){ stallSince = 0; lastFrames = -1; return; }
  if(now - lastEpgSync >= EPG_SYNC_MS || (epgEnd - Date.now() < 2*3600e3 && now - lastEpgSync >= 10*60e3)) loadEpg();
  const tokenSoon = now - lastChannelSync >= TOKEN_REFRESH_MS && !reloading && channels.some(c=>validUntil(c) < Date.now() + TOKEN_SOON_MS);
  if(now - lastChannelSync >= CHANNEL_SYNC_MS) reload(false); else if(tokenSoon) reload(false);
  if(failed){ if(now - lastRetry >= 10000){ lastRetry = now; setMsg("연결 재시도 중…"); play(true); } return; }
  if(userPaused) return;
  if(video.readyState < 3 && !video.paused || loading){
    if(!stallSince) stallSince = now;
    if(now - stallSince >= 7000){ stallSince = now; recoverStall(); }
    lastFrames = -1;
  } else {
    stallSince = 0;
    const f = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality().totalVideoFrames : video.currentTime;
    if(!video.paused){
      if(f !== lastFrames){ lastFrames = f; lastFramesAt = now; }
      else if(now - lastFramesAt >= 6000){ lastFramesAt = now; recoverStall(); }
    } else lastFrames = -1;
  }
}, 2000);

window.addEventListener("online", ()=>{ if(failed || stallSince) play(true); });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !stopped && video.paused && !userPaused) video.play().catch(()=>{}); });

async function reload(initial){
  if(reloading) return; reloading = true;
  try{
    let loaded = await loadChannels(), tries = 0;
    while(!loaded.length && tries < 12){ setMsg("채널 목록을 불러오는 중… 네트워크 확인"); await new Promise(r=>setTimeout(r,5000)); loaded = await loadChannels(); tries++; }
    if(!loaded.length){ setMsg("채널 목록을 불러올 수 없습니다. 네트워크를 확인하고 새로고침하세요"); return; }
    all = prefer(loaded);
    const playing = channels[index]?.name;
    const vis = Filter.shown(Filter.keepPlaying(Filter.visible(all), all, playing, video.readyState >= 3));
    const curName = playing ?? (S.startup && vis.some(c=>c.name===S.startup) ? S.startup : S.last);
    channels = vis;
    index = cursor = Math.max(0, vis.findIndex(c=>c.name===curName));
    const keep = !initial && playing && vis[index]?.name === playing && video.readyState > 0;
    renderList();
    if(!keep && !stopped) play(true);
  } finally { lastChannelSync = performance.now(); reloading = false; }
}

/* 채널 이동 */
function step(delta){
  if(!channels.length) return;
  clearTimeout(skipTimer); skipTimer = null; skipCount = 0;
  const now = performance.now();
  if(delta === lastStepDelta && now - lastStepAt < 120) return;
  const rapid = now - lastStepAt < 500;
  lastStepDelta = delta; lastStepAt = now;
  index = ((index + delta) % channels.length + channels.length) % channels.length; cursor = index;
  clearTimeout(stepTimer);
  if(!rapid) play(); else { showBanner(); updateBanner(); stepTimer = setTimeout(play, 250); }
}
function select(i){
  if(i < 0 || i >= channels.length) return;
  clearTimeout(stepTimer); clearTimeout(skipTimer); skipTimer = null; skipCount = 0;
  index = cursor = i; closeList(); play();
}
function toggleStop(){
  if(stopped){ play(true); return; }
  if(!channels.length) return;
  clearTimeout(stepTimer); clearTimeout(skipTimer); skipTimer = null; skipCount = 0;
  stopped = true; userPaused = true; failed = false; loading = false; setMsg(""); stallSince = 0;
  closeList(); destroyHls(); video.pause();
  $("stopLogo").classList.remove("hidden");
}

/* ───────── 배너 / EPG ───────── */
const fmt2 = n => String(n).padStart(2,"0");
const hm = ms => { const d = new Date(ms); return `${fmt2(d.getHours())}:${fmt2(d.getMinutes())}`; };
function showBanner(){
  $("banner").classList.add("show");
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(()=>{ if(!epgTimer) $("banner").classList.remove("show"); }, 3500);
}
function showEpgInfo(){
  if(!S.epgOn) return;
  updateBanner(true);
  $("banner").classList.add("show");
  clearTimeout(epgTimer);
  epgTimer = setTimeout(()=>{ epgTimer = null; $("banner").classList.remove("show"); }, 5000);
}
function hideEpgInfo(){ clearTimeout(epgTimer); epgTimer = null; }
function updateBanner(){
  const ch = channels[index]; if(!ch) return;
  const t = $("bTitle"); t.textContent = ch.title; t.classList.toggle("loading", loading);
  $("bSub").textContent = `${index+1} / ${channels.length}  ·  ${ch.group}`;
  const [cur, next] = S.epgOn ? nowNext(ch) : [null, null];
  const e = $("bEpg");
  e.innerHTML = "";
  if(cur){
    const a = document.createElement("div"); a.className = "now"; a.textContent = `${hm(cur.start)}–${hm(cur.stop)}  ${cur.title}`; e.appendChild(a);
    if(next){ const b = document.createElement("div"); b.textContent = `다음 ${hm(next.start)}  ${next.title}`; e.appendChild(b); }
    const pr = Math.max(0, Math.min(1, (Date.now()-cur.start)/Math.max(1, cur.stop-cur.start)));
    document.querySelector("#prog i").style.width = (pr*100)+"%";
  } else document.querySelector("#prog i").style.width = "0";
  const hasEpg = !!cur;
  $("bEpg").classList.toggle("hidden", !hasEpg); $("bSep1").classList.toggle("hidden", !hasEpg);
  $("prog").style.visibility = hasEpg ? "visible" : "hidden";
  $("bClock").classList.toggle("hidden", !S.clockOn); $("bSep2").classList.toggle("hidden", !S.clockOn);
  tickClock();
}
function tickClock(){
  const d = new Date(), h = d.getHours();
  $("ampm").textContent = h < 12 ? "오전" : "오후";
  $("clk").textContent = `${h%12 || 12}:${fmt2(d.getMinutes())}`;
}
setInterval(()=>{ tickClock(); if($("banner").classList.contains("show")) updateBanner(); }, 15000);

/* ───────── 채널 목록 ───────── */
function renderList(onlyCurrent){
  const box = $("items"), q = $("search").value.trim().toLowerCase();
  if(onlyCurrent && !listOpen) return;
  box.innerHTML = "";
  const frag = document.createDocumentFragment();
  channels.forEach((c, i)=>{
    if(q && !(c.title.toLowerCase().includes(q) || c.name.toLowerCase().includes(q) || String(i+1) === q)) return;
    const d = document.createElement("div");
    d.className = "it" + (i===index ? " cur" : "") + (i===cursor ? " sel" : ""); d.dataset.i = i;
    const [cur] = S.epgOn ? nowNext(c) : [null];
    d.innerHTML = `${c.logo ? `<img loading="lazy" referrerpolicy="no-referrer" alt="">` : ""}<div class="t"><div class="n"></div><div class="p"></div></div>`;
    if(c.logo) d.querySelector("img").src = c.logo, d.querySelector("img").onerror = e=>e.target.remove();
    d.querySelector(".n").textContent = `${i+1}  ${c.title}`;
    d.querySelector(".p").textContent = cur ? cur.title : c.group;
    d.onclick = ()=>select(i);
    frag.appendChild(d);
  });
  box.appendChild(frag);
  const sel = box.querySelector(".sel") || box.querySelector(".cur");
  if(sel) sel.scrollIntoView({block:"center"});
}
function openList(){
  cursor = index; listOpen = true; $("search").value = "";
  $("list").classList.add("open"); renderList(); keepListAlive();
}
function closeList(){ listOpen = false; $("list").classList.remove("open"); clearTimeout(listIdleTimer); }
function keepListAlive(){
  clearTimeout(listIdleTimer);
  if(listOpen) listIdleTimer = setTimeout(closeList, LIST_IDLE_MS);
}
function moveCursor(d){
  cursor = ((cursor + d) % channels.length + channels.length) % channels.length;
  document.querySelectorAll("#items .sel").forEach(e=>e.classList.remove("sel"));
  const e = document.querySelector(`#items .it[data-i="${cursor}"]`);
  if(e){ e.classList.add("sel"); e.scrollIntoView({block:"nearest"}); }
  keepListAlive();
}
$("items").addEventListener("scroll", keepListAlive);
$("list").addEventListener("pointermove", keepListAlive);
$("search").addEventListener("input", ()=>{ renderList(); keepListAlive(); });
$("menuBtn").onclick = ()=> listOpen ? closeList() : openList();
$("bStop").onclick = toggleStop;
$("bFull").onclick = toggleFullscreen;
$("bSettings").onclick = ()=>openSettings();

/* 즐겨찾기 */
function toggleFav(name){
  S.favs.has(name) ? S.favs.delete(name) : S.favs.add(name);
  store.set("favs", [...S.favs]);
  if(S.favOnly && !listOpen) rebuild();
}

/* 화면 비율 / 전체화면 */
function applyAspect(){ video.className = ASPECT_CLS[S.aspectOn ? S.aspect : 0]; $("aspectBtn").classList.toggle("hidden", !S.aspectOn); }
$("aspectBtn").onclick = ()=>{ if(!S.aspectOn) return; S.aspect = (S.aspect+1)%3; store.set("aspect", S.aspect); applyAspect(); toast("화면 비율: " + ASPECTS[S.aspect]); };
function toggleFullscreen(){
  if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(()=>{});
}
video.addEventListener("dblclick", toggleFullscreen);

/* UI 자동 숨김(마우스 움직임 시 버튼 표시) */
function pokeUi(){
  document.body.classList.add("ui"); clearTimeout(uiTimer);
  uiTimer = setTimeout(()=>document.body.classList.remove("ui"), 3000);
}
["mousemove","pointerdown","touchstart"].forEach(e=>document.addEventListener(e, pokeUi, {passive:true}));

/* 취침 예약 */
let sleepTimer = null;
function setSleep(h){
  S.sleepH = h; clearTimeout(sleepTimer);
  if(h > 0){
    sleepTimer = setTimeout(()=>{ S.sleepH = 0; if(!stopped) toggleStop(); toast("취침 예약 시간이 되어 재생을 정지했습니다"); }, h*3600e3);
    toast(`${h}시간 뒤 재생이 정지됩니다`);
  } else toast("취침 예약을 껐습니다");
}

/* ───────── 입력: 키보드 / 휠 / 스와이프 ───────── */
document.addEventListener("keydown", e=>{
  if(e.target === $("search")){ if(e.key === "Escape"){ $("search").blur(); closeList(); } else if(e.key === "Enter"){ const f = document.querySelector("#items .it"); if(f) select(+f.dataset.i); } return; }
  if(!$("settings").classList.contains("hidden")){ if(e.key === "Escape") closeSettings(); return; }
  pokeUi();
  switch(e.key){
    case "ArrowUp": case "PageUp": listOpen ? moveCursor(-1) : step(-1); e.preventDefault(); break;
    case "ArrowDown": case "PageDown": listOpen ? moveCursor(1) : step(1); e.preventDefault(); break;
    case "Enter": case "ArrowRight": listOpen ? select(cursor) : openList(); break;
    case "ArrowLeft": case "Escape": if(listOpen) closeList(); break;
    case "l": case "L": listOpen ? closeList() : openList(); break;
    case "f": case "F": toggleFullscreen(); break;
    case "m": case "M": userMuted = !userMuted; autoMuted = false; video.muted = userMuted; toast(userMuted ? "음소거" : "음소거 해제"); break;
    case "s": case "S": toggleStop(); break;
    case "a": case "A": $("aspectBtn").click(); break;
    case ",": openSettings(); break;
    case " ": e.preventDefault(); if(stopped) play(true); else if(video.paused){ userPaused = false; video.play(); } else { userPaused = true; video.pause(); } break;
  }
});
let wheelAt = 0;
document.addEventListener("wheel", e=>{
  if(e.target.closest("#list") || e.target.closest("#settings")) return;
  const now = performance.now(); if(now - wheelAt < 200) return; wheelAt = now;
  step(e.deltaY > 0 ? 1 : -1);
}, {passive:true});

/* 터치: 가로 스와이프 = 채널 이동, 세로 스와이프 = 볼륨, 탭 = 목록 */
let tStart = null;
$("stage").addEventListener("touchstart", e=>{
  if(e.touches.length !== 1){ tStart = null; return; }
  const t = e.touches[0]; tStart = {x:t.clientX, y:t.clientY, vol:video.volume, t:Date.now(), vert:false};
}, {passive:true});
$("stage").addEventListener("touchmove", e=>{
  if(!tStart) return; const t = e.touches[0], dx = t.clientX - tStart.x, dy = t.clientY - tStart.y;
  if(S.swipeVol && Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)*1.5){
    tStart.vert = true; userMuted = false; autoMuted = false; video.muted = false;
    video.volume = Math.max(0, Math.min(1, tStart.vol - dy / (innerHeight*0.6)));
    toast(`볼륨 ${Math.round(video.volume*100)}%`);
  }
}, {passive:true});
$("stage").addEventListener("touchend", e=>{
  if(!tStart) return; const t = e.changedTouches[0], dx = t.clientX - tStart.x, dy = t.clientY - tStart.y; const s = tStart; tStart = null;
  if(s.vert) return;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){ step(dx < 0 ? 1 : -1); return; }
  if(Math.abs(dx) < 10 && Math.abs(dy) < 10 && Date.now() - s.t < 300){ listOpen ? closeList() : openList(); }
}, {passive:true});
$("stage").addEventListener("click", e=>{ if("ontouchstart" in window) return; listOpen ? closeList() : (showBanner(), updateBanner()); });

/* 미디어 세션 (키보드 미디어 키 / 잠금화면) */
if("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("nexttrack", ()=>step(1));
  navigator.mediaSession.setActionHandler("previoustrack", ()=>step(-1));
  navigator.mediaSession.setActionHandler("play", ()=>{ userPaused = false; stopped ? play(true) : video.play(); });
  navigator.mediaSession.setActionHandler("pause", ()=>{ userPaused = true; video.pause(); });
}

/* ───────── 환경설정 ───────── */
const TABS = ["화면", "재생"];
S.favOnly = false; // '즐겨찾기만 보기' 설정 항목을 없앴으므로 예전에 켜 둔 값은 끈다
let sTab = 0, sSub = 0;
function openSettings(){ closeList(); sTab = 0; sSub = 0; $("settings").classList.remove("hidden"); renderSettings(); }
function closeSettings(){ $("settings").classList.add("hidden"); }
$("settings").addEventListener("click", e=>{ if(e.target.id === "settings") closeSettings(); });

function swRow(title, desc, val, on){
  const r = document.createElement("div"); r.className = "row";
  r.innerHTML = `<div class="l"><b></b><small></small></div><div class="sw ${val?"on":""}"></div>`;
  r.querySelector("b").textContent = title; r.querySelector("small").textContent = desc || "";
  r.onclick = ()=>{ on(!val); renderSettings(); };
  return r;
}
function head(title, desc){
  const r = document.createElement("div"); r.className = "row"; r.style.cursor = "default";
  r.innerHTML = `<div class="l"><b></b><small></small></div>`; r.querySelector("b").textContent = title; r.querySelector("small").textContent = desc || "";
  return r;
}
function tiles(labels, sel, on){
  const t = document.createElement("div"); t.className = "tiles";
  labels.forEach((l,i)=>{ const b = document.createElement("button"); b.textContent = l; if(i===sel) b.className = "on"; b.onclick = ()=>{ on(i); renderSettings(); }; t.appendChild(b); });
  return t;
}
function actionRow(title, desc, fn){
  const r = head(title, desc); r.style.cursor = "pointer"; r.onclick = fn; return r;
}

function renderSettings(){
  const tabs = $("tabs"); tabs.innerHTML = "";
  TABS.forEach((n,i)=>{ const d = document.createElement("div"); d.textContent = n; if(i===sTab && !sSub) d.className = "on"; d.onclick = ()=>{ sTab = i; sSub = 0; renderSettings(); }; tabs.appendChild(d); });
  const b = $("sbody"); b.innerHTML = "";
  const add = el => b.appendChild(el);

  if(sSub === 1){ // 숨겨진 채널
    const h = document.createElement("div"); h.className = "sub-h"; h.innerHTML = `<button>← 뒤로</button><span>숨겨진 채널</span>`; h.querySelector("button").onclick = ()=>{ sSub = 0; renderSettings(); }; add(h);
    const hid = all.map(c=>[c, isExpired(c) ? "만료" : bad[c.name] ? "재생 불가" : null]).filter(x=>x[1]);
    if(!hid.length) add(head("숨겨진 채널이 없습니다"));
    hid.forEach(([c, why])=>add(head(c.title, why)));
    add(actionRow("재생 불가 기록 지우기", "숨겨진 채널을 다시 목록에 포함합니다", ()=>{ bad = {}; store.set("bad", bad); rebuild(); sSub = 0; renderSettings(); }));
    return;
  }
  if(sSub === 2){ // 즐겨찾기 편집
    const h = document.createElement("div"); h.className = "sub-h";
    const edit = Filter.visible(all).filter((c,i,a)=>a.findIndex(x=>x.name===c.name)===i);
    const cnt = edit.filter(c=>S.favs.has(c.name)).length;
    h.innerHTML = `<button>← 저장</button><span>즐겨찾기 편집 (${cnt}개)</span><button>전체선택</button>`;
    const [back, allb] = h.querySelectorAll("button");
    back.onclick = ()=>{ sSub = 0; rebuild(); renderSettings(); };
    allb.onclick = ()=>{ const names = edit.map(c=>c.name); const allOn = names.every(n=>S.favs.has(n)); names.forEach(n=>allOn ? S.favs.delete(n) : S.favs.add(n)); store.set("favs",[...S.favs]); renderSettings(); };
    add(h);
    edit.forEach(c=>add(swRow(c.title, c.group, S.favs.has(c.name), v=>{ v ? S.favs.add(c.name) : S.favs.delete(c.name); store.set("favs",[...S.favs]); })));
    return;
  }
  if(sSub === 4){ // 시작 방송
    const h = document.createElement("div"); h.className = "sub-h"; h.innerHTML = `<button>← 뒤로</button><span>시작 방송</span>`; h.querySelector("button").onclick = ()=>{ sSub = 0; renderSettings(); }; add(h);
    const pick = (name, label)=>{ const r = actionRow(label, name===S.startup ? "✓ 선택됨" : "", ()=>{ S.startup = name; store.set("startup", name); toast("시작 방송: " + label); sSub = 0; renderSettings(); }); add(r); };
    pick(null, "마지막 시청 방송");
    channels.forEach(c=>pick(c.name, c.title));
    return;
  }

  if(sTab === 0){
    add(swRow("EPG 표시", "채널이 나오면 하단에 편성 정보를 잠깐 보여 줍니다", S.epgOn, v=>{ S.epgOn = v; store.set("epg_on", v); }));
    add(swRow("시계 표시", "정보창 오른쪽 끝에 현재 시각", S.clockOn, v=>{ S.clockOn = v; store.set("clock_on", v); }));
    add(head("화면 비율", "맞춤 · 채우기(잘라서 꽉 채움) · 늘이기"));
    add(tiles(ASPECTS, S.aspect, i=>{ S.aspect = i; store.set("aspect", i); applyAspect(); }));
    add(swRow("화면 비율 버튼", "끄면 비율을 맞춤으로 고정합니다", S.aspectOn, v=>{ S.aspectOn = v; store.set("aspect_on", v); applyAspect(); }));
    add(swRow("밀어서 볼륨 조절", "터치 화면을 위/아래로 밀어 볼륨 조절", S.swipeVol, v=>{ S.swipeVol = v; store.set("swipe_vol", v); }));
  } else if(sTab === 1){
    add(swRow("정지 버튼", "채널 목록 위쪽의 정지 버튼 표시", S.stopBtn, v=>{ S.stopBtn = v; store.set("stop_btn", v); $("bStop").classList.toggle("hidden", !v); if(!v && stopped) play(true); }));
    add(swRow("재생 불가 채널 자동 건너뛰기", "모든 주소가 실패하면 다음 채널로 이동합니다", S.skipOn, v=>{ S.skipOn = v; store.set("skip_on", v); if(!v){ clearTimeout(skipTimer); skipTimer = null; } }));
    add(head("건너뛰기 대기 시간"));
    add(tiles(SKIP_DELAYS.map(s=>s+"초"), S.skipIdx, i=>{ S.skipIdx = i; store.set("skip_delay", i); }));
  }
  const c = document.createElement("button"); c.className = "close"; c.textContent = "닫기"; c.onclick = closeSettings; add(c);
}

/* ───────── 시작 ───────── */
/* 실행 시 전체화면: 브라우저는 사용자 입력 없이 전체화면 진입을 막으므로, 먼저 시도해 보고 안 되면 첫 클릭/키/터치 때 진입한다 */
function enterFs(){
  if(document.fullscreenElement) return true;
  const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!f) return true;
  try{ const p = f.call(el); if(p && p.catch) p.catch(()=>{}); }catch{}
  return false;
}
enterFs();
const fsOnce = ()=>{ enterFs(); if(document.fullscreenElement){ ["pointerup","keydown","touchend"].forEach(ev=>document.removeEventListener(ev, fsOnce, true)); } };
["pointerup","keydown","touchend"].forEach(ev=>document.addEventListener(ev, fsOnce, true));
applyAspect();
$("bStop").classList.toggle("hidden", !S.stopBtn);
let splashDone = false;
function finishSplash(){ if(splashDone) return; splashDone = true; $("splash").classList.add("out"); setTimeout(()=>$("splash").remove(), 700); }
video.addEventListener("playing", ()=>setTimeout(finishSplash, 300), {once:true});
setTimeout(finishSplash, 12000);
loadEpg();
reload(true);
pokeUi();
</script>
</body>
</html>
